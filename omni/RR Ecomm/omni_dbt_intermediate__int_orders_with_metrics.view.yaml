# Reference this view as omni_dbt_intermediate__int_orders_with_metrics
dimensions:
  _entity_order: {}
  _entity_user: {}
  _filter_total_orders: {}

measures:
  order_count:
    # Measure is defined in the 'orders' dbt semantic model (models/marts/_semantic_models.yml)
    sql: ${omni_dbt_intermediate__int_orders_with_metrics.order_id}
    aggregate_type: count_distinct

  avg_order_value:
    # Measure is defined by the 'avg_order_value' dbt metric (models/marts/_metrics.yml)
    sql: CAST(${omni_dbt_intermediate__int_order_items_enriched.total_revenue} AS
      DOUBLE) /
      NULLIF(CAST(${omni_dbt_intermediate__int_orders_with_metrics.total_orders}
      AS DOUBLE), 0)

  total_orders:
    # Measure is defined by the 'total_orders' dbt metric (models/marts/_metrics.yml)
    sql: ${omni_dbt_intermediate__int_orders_with_metrics.order_id}
    aggregate_type: count_distinct
    filters:
      _filter_total_orders:
        is: true
