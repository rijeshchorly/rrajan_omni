# Reference this view as omni_dbt_intermediate__int_order_items_enriched
dimensions:
  _entity_order_item: {}
  _entity_order: {}
  _entity_user: {}
  _entity_product: {}
  _filter_total_cost: {}
  _filter_total_units_sold: {}

  _filter_total_revenue:
    description: Intermediat filter dimension for measure total_revenue

measures:
  revenue:
    sql: ${omni_dbt_intermediate__int_order_items_enriched.sale_price}
    aggregate_type: sum

  cost:
    sql: ${omni_dbt_intermediate__int_order_items_enriched.unit_cost}
    aggregate_type: sum

  units_sold:
    sql: ${omni_dbt_intermediate__int_order_items_enriched.order_item_id}
    aggregate_type: count

  returned_units:
    sql: CASE WHEN ${omni_dbt_intermediate__int_order_items_enriched.is_returned}
      THEN 1 ELSE 0 END
    aggregate_type: sum

  avg_days_to_deliver:
    sql: ${omni_dbt_intermediate__int_order_items_enriched.days_to_deliver}
    aggregate_type: average

  total_revenue:
    sql: ${omni_dbt_intermediate__int_order_items_enriched.sale_price}
    aggregate_type: sum
    filters:
      _filter_total_revenue:
        is: true

  total_cost:
    sql: ${omni_dbt_intermediate__int_order_items_enriched.unit_cost}
    aggregate_type: sum
    filters:
      _filter_total_cost:
        is: true

  return_rate:
    sql: CAST(${omni_dbt_intermediate__int_order_items_enriched.total_returned_units}
      AS DOUBLE) /
      NULLIF(CAST(${omni_dbt_intermediate__int_order_items_enriched.total_units_sold}
      AS DOUBLE), 0)

  total_units_sold:
    sql: ${omni_dbt_intermediate__int_order_items_enriched.order_item_id}
    aggregate_type: count
    filters:
      _filter_total_units_sold:
        is: true

  total_returned_units:
    sql: CASE WHEN ${omni_dbt_intermediate__int_order_items_enriched.is_returned}
      THEN 1 ELSE 0 END
    aggregate_type: sum

  avg_unit_cost:
    sql: ${omni_dbt_intermediate__int_order_items_enriched.unit_cost}
    label: Avg Unit Cost
    format: usdcurrency_2
    #description: Average unit cost across order items
    aggregate_type: average

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_order_items_enriched
  target_schema: prod
  description: |
    Order line items joined with product catalogue and inventory cost data. Core grain for all revenue and margin calculations. One row per order item.
  config:
    schema: intermediate
    materialized: view
  code: |-
    /*
      int_order_items_enriched
      ------------------------
      Enriches each order line item with product catalogue and inventory cost data.
      This is the core "fact" grain used by most downstream mart models.
    */

    with order_items as (
        select * from {{ ref('stg_order_items') }}
    ),

    products as (
        select * from {{ ref('stg_products') }}
    ),

    inventory as (
        select * from {{ ref('stg_inventory_items') }}
    ),

    int_order_items_enriched as (
        select
            -- line item identifiers
            oi.order_item_id,
            oi.order_id,
            oi.user_id,
            oi.product_id,
            oi.inventory_item_id,

            -- order item status
            oi.status,
            oi.is_returned,
            oi.days_to_deliver,

            -- product attributes (from catalogue)
            p.product_name,
            p.product_category,
            p.product_brand,
            p.product_department,
            p.product_sku,

            -- financials
            oi.sale_price,
            coalesce(inv.cost, p.cost)              as unit_cost,
            oi.sale_price - coalesce(inv.cost, p.cost)  as gross_profit,
            round(
                case when oi.sale_price > 0
                     then (oi.sale_price - coalesce(inv.cost, p.cost)) / oi.sale_price
                     else null
                end,
                4
            )                                       as gross_margin_pct,

            -- timestamps
            oi.created_at,
            oi.shipped_at,
            oi.delivered_at,
            oi.returned_at

        from order_items oi
        left join products p
            on oi.product_id = p.product_id
        left join inventory inv
            on oi.inventory_item_id = inv.inventory_item_id
    )

    select * from int_order_items_enriched
  referenced_by:
    [
      int_orders_with_metrics,
      mart_category_performance,
      mart_product_performance
    ]
