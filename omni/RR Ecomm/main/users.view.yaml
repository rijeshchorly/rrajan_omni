# Reference this view as main__users
schema: main
table_name: users

#comment
dimensions:
  first_name: {}
  last_name: {}
  email: {}
  age: {}
  gender: {}
  state: {}
  street_address: {}
  postal_code: {}
  city: {}
  country: {}
  latitude: {}
  longitude: {}
  traffic_source: {}
  created_at: {}

  email_domain:
    sql: SUBSTRING(${main__users.email}, COALESCE(CASE WHEN POSITION('@' IN
      SUBSTRING(${main__users.email}, 1, LENGTH(${main__users.email}))) > 0 THEN
      POSITION('@' IN SUBSTRING(${main__users.email}, 1,
      LENGTH(${main__users.email}))) + (1 - 1) ELSE NULL END, 0) + 1,
      COALESCE(LENGTH(${main__users.email}), 0) - COALESCE(CASE WHEN
      POSITION('@' IN SUBSTRING(${main__users.email}, 1,
      LENGTH(${main__users.email}))) > 0 THEN POSITION('@' IN
      SUBSTRING(${main__users.email}, 1, LENGTH(${main__users.email}))) + (1 -
      1) ELSE NULL END, 0))
    label: Email Domain

  full_name:
    sql: CONCAT(COALESCE(CONCAT(COALESCE(${main__users.first_name}, ''), ' '), ''),
      COALESCE(${main__users.last_name}, ''))
    label: Full Name

  street_name:
    sql: REGEXP_EXTRACT(${main__users.street_address},
      '^\d+\s+(.+?)(?:\s+(?:Apt|Suite|Ste|Unit|#).*)?$', 1)
    label: Street Name

  id:
    format: ID
    primary_key: true

measures:
  count:
    aggregate_type: count
