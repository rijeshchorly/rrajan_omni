# Reference this view as main__products
schema: main
table_name: products

dimensions:
  cost: {}
  category: {}
  name: {}
  brand: {}
  retail_price: {}
  department: {}
  sku: {}

  retail_price_level_of_detail:
    sql: ${main__products.retail_price}
    label: Retail Price Level of Detail
    level_of_detail:
      aggregate_type: max
      always_include: [ main__products.distribution_center_id ]

  id:
    format: ID
    primary_key: true

  distribution_center_id:
    format: ID

measures:
  count:
    aggregate_type: count
