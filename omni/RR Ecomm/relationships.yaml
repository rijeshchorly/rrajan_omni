- join_from_view: prod_intermediate__int_session_events
  join_to_view: prod_intermediate__int_user_sessions
  join_type: always_left
  on_sql: ${prod_intermediate__int_session_events.user_id} =
    ${prod_intermediate__int_user_sessions.user_id}
  relationship_type: many_to_one

- join_from_view: main__inventory_items
  join_to_view: main__products
  join_type: always_left
  on_sql: ${main__inventory_items.product_id} = ${main__products.id}
  relationship_type: assumed_many_to_one

- join_from_view: main__order_items
  join_to_view: main__orders
  join_type: always_left
  on_sql: ${main__order_items.order_id} = ${main__orders.order_id}
  relationship_type: assumed_many_to_one
  join_to_view_as_label: OR Items

- join_from_view: main__order_items
  join_to_view: main__users
  join_type: always_left
  on_sql: ${main__order_items.user_id} = ${main__users.id}
  relationship_type: assumed_many_to_one
  join_to_view_as_label: OR Items

- join_from_view: main__order_items
  join_to_view: main__products
  join_type: always_left
  on_sql: ${main__order_items.product_id} = ${main__products.id}
  relationship_type: assumed_many_to_one

- join_from_view: main__orders
  join_to_view: main__users
  join_type: always_left
  on_sql: ${main__orders.user_id} = ${main__users.id}
  relationship_type: assumed_many_to_one

- join_from_view: main__orders_enriched
  join_to_view: main__orders
  join_type: always_left
  on_sql: ${main__orders_enriched.order_id} = ${main__orders.order_id}
  relationship_type: assumed_many_to_one

- join_from_view: main__orders_enriched
  join_to_view: main__users
  join_type: always_left
  on_sql: ${main__orders_enriched.user_id} = ${main__users.id}
  relationship_type: assumed_many_to_one

- join_from_view: main__order_items
  join_to_view: main__inventory_items
  join_type: always_left
  on_sql: |
    ${main__order_items.inventory_item_id} = ${main__inventory_items.id} AND ${main__products.id} = ${main__inventory_items.product_id}
  relationship_type: many_to_one
