# Reference this view as intermediate_prod__int_orders_with_metrics
dimensions:
  _entity_order: {}
  _entity_user: {}
  _filter_total_orders: {}

measures:
  order_count:
    aggregate_type: count_distinct

  avg_order_value:
    sql: CAST(${intermediate_prod__int_order_items_enriched.total_revenue} AS
      DOUBLE) / NULLIF(CAST(${total_orders} AS DOUBLE), 0)

  total_orders:
    aggregate_type: count_distinct
    filters:
      _filter_total_orders:
        is: true
