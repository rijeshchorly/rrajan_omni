# Reference this view as intermediate_prod__int_order_items_enriched
dimensions:
  _entity_order_item: {}
  _entity_order: {}
  _entity_user: {}
  _entity_product: {}
  _filter_total_revenue: {}
  _filter_total_cost: {}
  _filter_total_units_sold: {}

measures:
  revenue:
    aggregate_type: sum

  cost:
    aggregate_type: sum

  units_sold:
    aggregate_type: count

  returned_units:
    aggregate_type: sum

  total_revenue:
    aggregate_type: sum
    filters:
      _filter_total_revenue:
        is: true

  total_cost:
    aggregate_type: sum
    filters:
      _filter_total_cost:
        is: true

  return_rate:
    sql: CAST(${total_returned_units} AS DOUBLE) / NULLIF(CAST(${total_units_sold}
      AS DOUBLE), 0)

  total_units_sold:
    aggregate_type: count
    filters:
      _filter_total_units_sold:
        is: true
