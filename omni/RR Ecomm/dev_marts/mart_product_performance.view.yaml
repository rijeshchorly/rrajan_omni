# Reference this view as dev_marts__mart_product_performance
schema: dev_marts
table_name: mart_product_performance

dimensions:
  product_name: {}
  product_category: {}
  product_brand: {}
  product_department: {}
  total_units_sold: {}
  total_orders: {}
  unique_buyers: {}
  total_revenue: {}
  total_cost: {}
  total_gross_profit: {}
  avg_sale_price: {}
  avg_gross_margin_pct: {}
  returned_units: {}
  return_rate: {}
  avg_days_to_deliver: {}
  first_sold_at: {}
  last_sold_at: {}

  product_id:
    format: ID

measures:
  count:
    aggregate_type: count
