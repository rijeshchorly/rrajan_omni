# Reference this view as omni_dbt_intermediate__int_session_events
measures:
  total_sessions:
    aggregate_type: count

  converted_sessions:
    sql: ${omni_dbt_intermediate__int_session_events.converted}
    aggregate_type: sum

  conversion_rate:
    sql: ${omni_dbt_intermediate__int_session_events.converted_sessions} /
      NULLIF(${omni_dbt_intermediate__int_session_events.total_sessions}, 0)
    format: percent_2

  avg_session_duration:
    sql: ${omni_dbt_intermediate__int_session_events.session_duration_minutes}
    label: Avg Session Duration (min)
    aggregate_type: average

  total_product_views:
    sql: ${omni_dbt_intermediate__int_session_events.product_views}
    aggregate_type: sum

  total_purchase_events:
    sql: ${omni_dbt_intermediate__int_session_events.purchase_events}
    aggregate_type: sum

  total_cart_events:
    sql: ${omni_dbt_intermediate__int_session_events.cart_events}
    aggregate_type: sum

  total_cancel_events:
    sql: ${omni_dbt_intermediate__int_session_events.cancel_events}
    aggregate_type: sum
