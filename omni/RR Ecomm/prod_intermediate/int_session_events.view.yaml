# Reference this view as prod_intermediate__int_session_events
schema: prod_intermediate
table_name: int_session_events

dimensions:
  traffic_source: {}
  browser: {}
  city: {}
  state: {}
  total_events: {}
  session_start_at: {}
  session_end_at: {}
  session_duration_minutes: {}
  home_events: {}
  department_events: {}
  product_views: {}
  cart_events: {}
  purchase_events: {}
  cancel_events: {}
  converted: {}

  session_id:
    format: ID

  user_id:
    format: ID

measures:
  total_sessions:
    aggregate_type: count

  converted_sessions:
    sql: ${prod_intermediate__int_session_events.converted}
    aggregate_type: sum

  conversion_rate:
    sql: ${prod_intermediate__int_session_events.converted_sessions} /
      NULLIF(${prod_intermediate__int_session_events.total_sessions}, 0)
    format: percent_2

  avg_session_duration:
    sql: ${prod_intermediate__int_session_events.session_duration_minutes}
    label: Avg Session Duration (min)
    aggregate_type: average

  total_product_views:
    sql: ${prod_intermediate__int_session_events.product_views}
    aggregate_type: sum

  total_purchase_events:
    sql: ${prod_intermediate__int_session_events.purchase_events}
    aggregate_type: sum

  total_cart_events:
    sql: ${prod_intermediate__int_session_events.cart_events}
    aggregate_type: sum

  total_cancel_events:
    sql: ${prod_intermediate__int_session_events.cancel_events}
    aggregate_type: sum

  count:
    aggregate_type: count
