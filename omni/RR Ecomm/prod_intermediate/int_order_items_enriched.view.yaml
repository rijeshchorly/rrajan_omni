# Reference this view as prod_intermediate__int_order_items_enriched
schema: prod_intermediate
table_name: int_order_items_enriched

dimensions:
  unit_cost: {}
  status: {}
  is_returned: {}
  days_to_deliver: {}
  product_name: {}
  product_category: {}
  product_brand: {}
  product_department: {}
  product_sku: {}
  sale_price: {}
  gross_profit: {}
  gross_margin_pct: {}
  created_at: {}
  shipped_at: {}
  delivered_at: {}
  returned_at: {}

  _filter_total_revenue:
    description: Intermediat filter dimension for measure total_revenue

  order_item_id:
    format: ID

  order_id:
    format: ID

  user_id:
    format: ID

  product_id:
    format: ID

  inventory_item_id:
    format: ID

measures:
  total_revenue:
    aggregate_type: sum
    filters:
      _filter_total_revenue:
        is: true

  total_cost:
    aggregate_type: sum
    filters:
      _filter_total_cost:
        is: true

  return_rate:
    sql: CAST(${total_returned_units} AS DOUBLE) / NULLIF(CAST(${total_units_sold}
      AS DOUBLE), 0)

  total_units_sold:
    aggregate_type: count
    filters:
      _filter_total_units_sold:
        is: true

  count:
    aggregate_type: count
