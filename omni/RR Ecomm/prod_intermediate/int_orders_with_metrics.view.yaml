# Reference this view as prod_intermediate__int_orders_with_metrics
label: Orders
#This description was pulled from dbt.
description: |
  Order header enriched with aggregated line-item metrics (revenue, cost, gross profit, fulfilment timing). One row per order.

schema: prod_intermediate
table_name: int_orders_with_metrics

dimensions:
  status: {}
  gender: {}
  num_of_item: {}
  item_count: {}
  order_revenue: {}
  order_cost: {}
  order_gross_profit: {}
  avg_item_margin_pct: {}
  returned_item_count: {}
  has_return: {}
  last_shipped_at: {}
  last_delivered_at: {}
  days_order_to_delivery: {}
  created_at: {}
  returned_at: {}
  shipped_at: {}
  delivered_at: {}

  order_id:
    format: ID
    primary_key: true

  user_id:
    format: ID

  _entity_order:
    # Entity is defined in the 'orders' dbt semantic model (models/marts/_semantic_models.yml)
    sql: ${order_id}
    hidden: true

  _entity_user:
    # Entity is defined in the 'orders' dbt semantic model (models/marts/_semantic_models.yml)
    sql: ${user_id}
    hidden: true

  _filter_total_orders:
    # Produced by the dbt semantic layer integration
    sql: ${status} <> 'Cancelled'
    description: Intermediate filter dimension for measure total_orders
    hidden: true

measures:
  count:
    aggregate_type: count

  order_count:
    # Measure is defined in the 'orders' dbt semantic model (models/marts/_semantic_models.yml)
    sql: ${order_id}
    description: Count of distinct orders
    aggregate_type: count_distinct

  avg_order_value:
    # Measure is defined by the 'avg_order_value' dbt metric (models/marts/_metrics.yml)
    sql: CAST(${prod_intermediate__int_order_items_enriched.total_revenue} AS
      DOUBLE) / NULLIF(CAST(${total_orders} AS DOUBLE), 0)
    label: Average Order Value
    description: Average revenue per non-cancelled order

  total_orders:
    # Measure is defined by the 'total_orders' dbt metric (models/marts/_metrics.yml)
    sql: ${order_id}
    label: Total Orders
    description: Count of distinct orders excluding cancelled
    aggregate_type: count_distinct
    filters:
      _filter_total_orders:
        is: true

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: int_orders_with_metrics
  target_schema: prod
  description: |
    Order header enriched with aggregated line-item metrics (revenue, cost, gross profit, fulfilment timing). One row per order.
  config:
    schema: intermediate
    materialized: view
  code: |-
    /*
      int_orders_with_metrics
      -----------------------
      Rolls enriched order items up to order level, adding revenue and
      fulfilment metrics alongside order header attributes.
    */

    with orders as (
        select * from {{ ref('stg_orders') }}
    ),

    order_items_enriched as (
        select * from {{ ref('int_order_items_enriched') }}
    ),

    item_agg as (
        select
            order_id,
            count(*)                            as item_count,
            sum(sale_price)                     as order_revenue,
            sum(unit_cost)                      as order_cost,
            sum(gross_profit)                   as order_gross_profit,
            round(avg(gross_margin_pct), 4)     as avg_item_margin_pct,
            sum(case when is_returned then 1 else 0 end) as returned_item_count,
            min(created_at)                     as first_item_created_at,
            max(shipped_at)                     as last_shipped_at,
            max(delivered_at)                   as last_delivered_at
        from order_items_enriched
        group by 1
    ),

    int_orders_with_metrics as (
        select
            -- header
            o.order_id,
            o.user_id,
            o.status,
            o.gender,
            o.num_of_item,

            -- item aggregates
            ia.item_count,
            ia.order_revenue,
            ia.order_cost,
            ia.order_gross_profit,
            ia.avg_item_margin_pct,
            ia.returned_item_count,
            case when ia.returned_item_count > 0 then true else false end as has_return,

            -- fulfilment
            ia.last_shipped_at,
            ia.last_delivered_at,
            case
                when ia.last_delivered_at is not null and o.created_at is not null
                then date_diff('day', o.created_at::date, ia.last_delivered_at::date)
            end                                             as days_order_to_delivery,

            -- timestamps
            o.created_at,
            o.returned_at,
            o.shipped_at,
            o.delivered_at

        from orders o
        left join item_agg ia
            on o.order_id = ia.order_id
    )

    select * from int_orders_with_metrics
  referenced_by: [ mart_daily_revenue, int_user_order_history ]
