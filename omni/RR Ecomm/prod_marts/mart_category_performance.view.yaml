# Reference this view as prod_marts__mart_category_performance
schema: prod_marts
table_name: mart_category_performance

dimensions:
  month: {}
  product_category: {}
  product_department: {}
  units_sold: {}
  orders: {}
  unique_buyers: {}
  revenue: {}
  cost: {}
  gross_profit: {}
  gross_margin_pct: {}
  returned_units: {}
  return_rate: {}

measures:
  cost_sum:
    sql: ${prod_marts__mart_category_performance.cost}
    aggregate_type: sum

  orders_count_distinct:
    sql: ${prod_marts__mart_category_performance.orders}
    aggregate_type: count_distinct

  count:
    aggregate_type: count
