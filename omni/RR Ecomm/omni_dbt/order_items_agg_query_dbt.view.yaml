# Reference this view as omni_dbt__order_items_agg_query_dbt
schema_label: ""

schema: omni_dbt
table_name: order_items_agg_query_dbt

dimensions:
  id_count_distinct: {}
  sale_price_sum: {}

  id:
    format: ID
    primary_key: true

  user_id:
    format: ID

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: order_items_agg_query_dbt
  target_schema: prod
  config:
    materialized: table
  code: |-
    {{ config(materialized='table') }}

    SELECT "id",
        "user_id",
        COUNT(DISTINCT "id") AS "id_count_distinct",
        COALESCE(SUM("sale_price"), 0) AS "sale_price_sum"
    FROM {{source('Ecomm', 'order_items')}} AS "main__order_items"
    GROUP BY 1, 2
