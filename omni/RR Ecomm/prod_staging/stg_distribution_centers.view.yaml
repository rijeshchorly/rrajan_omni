# Reference this view as prod_staging__stg_distribution_centers
#This description was pulled from dbt.
description: Physical distribution centres. One row per centre.

schema: prod_staging
table_name: stg_distribution_centers

dimensions:
  distribution_center_name: {}
  dc_latitude: {}
  dc_longitude: {}

  distribution_center_id:
    format: ID

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_distribution_centers
  target_schema: prod
  description: Physical distribution centres. One row per centre.
  config:
    schema: staging
    materialized: view
  code: |-
    with distribution_centers as (
        select * from {{ source('Ecomm', 'distribution_centers') }}
    ),

    stg_distribution_centers as (
        select
            -- ids
            id          as distribution_center_id,

            -- attributes
            name        as distribution_center_name,
            latitude    as dc_latitude,
            longitude   as dc_longitude

        from distribution_centers
    )

    select * from stg_distribution_centers
