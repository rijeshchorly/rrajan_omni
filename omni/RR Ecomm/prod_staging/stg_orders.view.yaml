# Reference this view as prod_staging__stg_orders
#This description was pulled from dbt.
description: Cleaned and renamed orders. One row per order.

schema: prod_staging
table_name: stg_orders

dimensions:
  gender: {}
  num_of_item: {}
  created_at: {}
  returned_at: {}
  shipped_at: {}
  delivered_at: {}
  is_order: {}

  order_id:
    format: ID

  user_id:
    format: ID

  status:
    all_values: [ Cancelled, Complete, Processing, Returned, Shipped ]

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_orders
  target_schema: prod
  description: Cleaned and renamed orders. One row per order.
  config:
    schema: staging
    materialized: view
  code: |-
    with orders as (
        select * from {{ source('Ecomm', 'orders') }}
    ),

    stg_orders as (
        select
            -- ids
            order_id,
            user_id,

            -- attributes
            status,
            gender,
            num_of_item,

            -- timestamps
            created_at,
            returned_at,
            shipped_at,
            delivered_at,
            is_order

        from orders
    )

    select * from stg_orders
  referenced_by: [ int_orders_with_metrics ]
