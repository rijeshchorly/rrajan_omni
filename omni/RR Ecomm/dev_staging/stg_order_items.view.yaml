# Reference this view as dev_staging__stg_order_items
schema: dev_staging
table_name: stg_order_items

dimensions:
  status: {}
  sale_price: {}
  created_at: {}
  shipped_at: {}
  delivered_at: {}
  returned_at: {}
  is_returned: {}
  days_to_deliver: {}

  order_item_id:
    format: ID

  order_id:
    format: ID

  user_id:
    format: ID

  product_id:
    format: ID

  inventory_item_id:
    format: ID

measures:
  count:
    aggregate_type: count

  count_last_year:
    label: Count (Last Year)
    aggregate_type: count
    filters:
      created_at:
        date_offset_from_query: 1 year
        cancel_query_filter: true
