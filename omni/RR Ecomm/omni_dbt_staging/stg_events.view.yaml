schema: omni_dbt_staging
table_name: stg_events

dimensions:
  sequence_number: {}
  event_type: {}
  uri: {}
  city: {}
  state: {}
  postal_code: {}
  ip_address: {}
  browser: {}
  traffic_source: {}
  created_at: {}

  event_id:
    format: ID

  user_id:
    format: ID

  session_id:
    format: ID

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: stg_events
  target_schema: prod
  description: Web-session events. One row per event.
  config:
    schema: staging
    materialized: view
  code: |-
    with events as (
        select * from {{ source('Ecomm', 'events') }}
    ),

    stg_events as (
        select
            -- ids
            id              as event_id,
            user_id,
            session_id,
            sequence_number,

            -- event attributes
            event_type,
            uri,

            -- location & device
            city,
            state,
            postal_code,
            ip_address,
            browser,
            traffic_source,

            -- timestamps
            created_at

        from events
    )

    select * from stg_events
  referenced_by: [ int_session_events ]
