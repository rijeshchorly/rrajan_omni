# Reference this view as main__order_items
dimensions:
  next_shipped_text:
    sql: STRFTIME(shipped_at, '%d.%m.%Y')
    markdown: "**{{main__order_items.next_shipped_text.value}}** —
      [Search](https://google.com)"

  next_delivered_text:
    sql: STRFTIME(delivered_at, '%d.%m.%Y')
    markdown: "**{{value}}** — [Search](https://google.com)"

  #pct_of_total_revenue:
  pct_of_total_amount:
    sql: AVG(${main__order_items.sale_price}) OVER ( ORDER BY
      ${main__order_items.created_at[date]} ROWS BETWEEN 27 PRECEDING AND
      CURRENT ROW )
    label: Pct Total Revenue

measures:
  sale_price_sum:
    sql: ${main__order_items.sale_price}
    #format: BIGUSDCURRENCY
    aggregate_type: sum

  sale_price_pct_of_total:
    sql: ${main__order_items.sale_price}
    drill_fields: [ id, order_id, sale_price_pct_of_total ]
    aggregate_type: sum
    level_of_detail:
      aggregate_type: average
      fixed: []

  id_count_distinct:
    sql: ${main__order_items.id}
    label: Order Items Count
    format: NUMBER_0
    aggregate_type: count_distinct

  average_sale_price:
    sql: CASE WHEN ${main__order_items.id_count_distinct} = 0 THEN NULL ELSE
      COALESCE(${main__order_items.sale_price_sum}, 0) /
      ${main__order_items.id_count_distinct} END
    label: Average Sale Price USD
    format: BIGUSDCURRENCY_2

  order_items_count_status_cancelled:
    sql: ${main__order_items.id}
    label: Cancelled Orders
    format: NUMBER_0
    aggregate_type: count_distinct
    filters:
      status:
        is: Cancelled

  omni__cancelled_orders:
    sql: ${main__order_items.order_items_count_status_cancelled}/${main__order_items.id_count_distinct}
    label: "% Cancelled Orders"

  average_sale_price_gbp:
    sql: CASE WHEN ${main__order_items.id_count_distinct} = 0 THEN NULL ELSE
      COALESCE(${main__order_items.sale_price_sum}, 0) /
      ${main__order_items.id_count_distinct} END
    label: Average Sale Price GBP
    format: BIGGBPCURRENCY_2

  number_of_status_relevant_orders:
    sql: ${main__order_items.order_id}
    label: "# Orders [Status Excluded]"
    group_label: Core Metrics
    description: Distinct order count excluding order status, used as a stable
      denominator for rate calculations.
    aggregate_type: max
    level_of_detail:
      aggregate_type: count_distinct
      always_exclude: [ main__order_items.status ]

  pct_orders_by_status:
    sql: OMNI_FX_SAFE_DIVIDE(${main__order_items.id_count_distinct},
      ${main__order_items.number_of_status_relevant_orders})
    label: "% Orders [by Status]"
    group_label: Core Metrics

  pct_p50_over_p75:
    sql: CASE WHEN ${main__order_items.p75_sale_price} = 0 THEN NULL ELSE
      COALESCE(${main__order_items.p50_sale_price}, 0) /
      ${main__order_items.p75_sale_price} END
    format: PERCENT_2

  p75_sale_price:
    sql: PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY
      ${main__order_items.sale_price})

  p50_sale_price:
    sql: PERCENTILE_CONT(0.50) WITHIN GROUP (ORDER BY
      ${main__order_items.sale_price})
